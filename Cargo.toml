[package]
name = "vulpes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "AT Protocol identity for Rust servers: the did:plc write path (mint, update handle, tombstone), envelope-encrypted key custody, and durable OAuth state."
repository = "https://github.com/ZurNetwork/vulpes"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["atproto", "did", "plc", "oauth", "bluesky"]
categories = ["authentication", "cryptography", "web-programming"]
# Consumed as a tag-pinned git dependency; deliberately NOT published to
# crates.io (Engineer ruling, 2026-08-09).
publish = false

[features]
# The did:plc write path is the crate's reason to exist, so it is on by default.
# `--no-default-features` leaves the pure protocol core (no crypto, no I/O).
default = ["minter", "directory"]
# Key generation and the mint / update-handle / tombstone operations.
minter = ["dep:atrium-crypto", "dep:rand", "dep:base64"]
# The HTTP client that submits signed operations to a PLC directory.
directory = ["dep:reqwest", "dep:tracing"]
# The atproto OAuth authenticator (jacquard) and its durable state bridge.
oauth = [
  "dep:jacquard",
  "dep:jacquard-oauth",
  "dep:jacquard-common",
  "dep:fluent-uri",
  "dep:smol_str",
  "dep:reqwest",
]
# sqlx implementations of every vulpes storage trait, plus the migration SQL.
postgres = ["dep:sqlx", "dep:chrono"]
# The `/.well-known/atproto-did` resolution handler as a mountable router.
axum = ["dep:axum", "dep:http"]

[dependencies]
# --- core (no feature gate) ---
async-trait = "0.1"
thiserror = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# DAG-CBOR (RFC 8949 core-deterministic): canonically sorts map/struct keys on
# serialize — load-bearing for byte-exact PLC operation hashing.
serde_ipld_dagcbor = "0.6"
sha2 = "0.10"
# base32 for the DID suffix and the multibase CID.
data-encoding = "2"
# Envelope encryption of secrets at rest (AEAD under a root key).
chacha20poly1305 = "0.10"
# HKDF-SHA256 derives a dedicated MAC subkey from the vault root key, and
# HMAC-SHA256 is the operation-log integrity tag — so the root key stays
# single-purpose (AEAD) and the MAC uses its own domain-separated key.
hkdf = "0.12"
hmac = "0.12"
# Wipe secret material from memory on drop.
zeroize = { version = "1", features = ["derive"] }
# Constant-time equality over private key bytes — see `SecretKey`'s `PartialEq`.
subtle = "2"

# --- minter ---
# secp256k1 keygen + atproto-canonical ECDSA-SHA256 sign (low-S, 64-byte r‖s) +
# did:key multikey formatting. The vetted primitive, not hand-rolled k256.
atrium-crypto = { version = "0.1.3", optional = true }
rand = { version = "0.8", optional = true }
# base64url (no pad) for the operation signature.
base64 = { version = "0.22", optional = true }

# --- directory / oauth ---
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
], optional = true }
tracing = { version = "0.1", optional = true }

# --- oauth ---
jacquard = { version = "0.12.0", features = ["loopback", "derive"], optional = true }
jacquard-oauth = { version = "0.12.0", optional = true }
jacquard-common = { version = "0.12.0", optional = true }
fluent-uri = { version = "0.4.1", features = ["std"], optional = true }
smol_str = { version = "0.3.6", optional = true }

# --- postgres ---
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "migrate",
  "derive",
  "chrono",
  "json",
], optional = true }
chrono = { version = "0.4", optional = true }

# --- axum ---
axum = { version = "0.8.8", optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
# Assert signatures are low-S (Signature::normalize_s) in tests.
k256 = { version = "0.13", features = ["ecdsa"] }
# Throwaway Postgres for the storage round-trips, pinned to the same major
# version production runs.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
uuid = { version = "1.20.0", features = ["v7"] }
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true
