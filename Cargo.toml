[package]
name = "vulpes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The ACP (Attested Claims Protocol) on AT Protocol: claim and attestation records, signing and verification, status lists, and the did:plc write path with envelope-encrypted key custody."
repository = "https://github.com/ZurNetwork/vulpes"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["atproto", "did", "plc", "attestation", "bluesky"]
categories = ["authentication", "cryptography"]
# Consumed as a tag-pinned git dependency; deliberately NOT published to
# crates.io (Engineer ruling, 2026-08-09).
publish = false

[features]
# The did:plc write path is on by default; `acp` is opt-in.
# `--no-default-features` leaves the pure protocol core (no crypto, no I/O).
# vulpes carries no transport or framework of its own (FORKS F49).
default = ["minter"]
# Key generation and the mint / update-handle / tombstone operations.
minter = ["dep:atrium-crypto", "dep:rand", "dep:base64"]
# The ACP reference verifier: the record types with canonical DAG-CBOR bytes,
# the attestation pre-image / sign / verify heart, status lists, and the
# seven-step verifier over three caller-implemented I/O ports. No transport
# of its own: the consumer implements the ports (FORKS F49).
acp = ["dep:atrium-crypto", "dep:serde_bytes"]

[dependencies]
# --- core (no feature gate) ---
async-trait = "0.1"
thiserror = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# DAG-CBOR (RFC 8949 core-deterministic): canonically sorts map/struct keys on
# serialize — load-bearing for byte-exact PLC operation hashing.
serde_ipld_dagcbor = "0.6"
sha2 = "0.10"
# base32 for the DID suffix and the multibase CID.
data-encoding = "2"
# Envelope encryption of secrets at rest (AEAD under a root key).
chacha20poly1305 = "0.10"
# HKDF-SHA256 derives a dedicated MAC subkey from the vault root key, and
# HMAC-SHA256 is the operation-log integrity tag — so the root key stays
# single-purpose (AEAD) and the MAC uses its own domain-separated key.
hkdf = "0.12"
hmac = "0.12"
# Wipe secret material from memory on drop.
zeroize = { version = "1", features = ["derive"] }
# Constant-time equality over private key bytes — see `SecretKey`'s `PartialEq`.
subtle = "2"

# --- minter ---
# secp256k1 keygen + atproto-canonical ECDSA-SHA256 sign (low-S, 64-byte r‖s) +
# did:key multikey formatting. The vetted primitive, not hand-rolled k256.
atrium-crypto = { version = "0.1.3", optional = true }
rand = { version = "0.8", optional = true }
# base64url (no pad) for the operation signature.
base64 = { version = "0.22", optional = true }

# --- acp ---
# `sig` must be CBOR major type 2 (a byte string); without this marker serde
# encodes `Vec<u8>` as an array of integers — canonical, but wrong on the wire.
serde_bytes = { version = "0.11", optional = true }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt"] }
# Assert signatures are low-S (Signature::normalize_s) in tests.
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true
