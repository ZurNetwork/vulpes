# cargo-deny: the dependency advisory gate.
#
# The job of this file is NOT to be green — it is to be green for reasons
# somebody wrote down. Every entry below names an advisory that fires against
# this lockfile today, says why it is not exploitable here, and says what would
# make it go away. A NEW advisory has no entry, so it fails CI loudly.
#
# Re-check the list whenever `Cargo.lock` moves. An entry that no longer fires
# is stale documentation of a risk that is gone; cargo-deny reports it as
# `warning[advisory-not-detected]` — a WARNING, so it does not fail this job.
# Set `unused-ignored-advisory = "deny"` below if you would rather CI stop on
# it; that trades a loud reminder for a red build when somebody else's upstream
# fix lands, which is a workflow call, not a security one.
#
# Run it the way CI does — feature-gated dependencies are not in the default
# graph at all:
#
#     cargo deny --all-features check advisories

[advisories]
version = 2
# An unmaintained crate is a supply-chain fact worth a CI failure, not a shrug.
unmaintained = "all"
yanked = "deny"

ignore = [
  # Empty since FORKS F49 (2026-10-01): every entry that stood here belonged
  # to a dependency of a removed feature — jacquard (rsa, hickory,
  # atomic-polyfill), the ssi stack behind `vc` (seven unmaintained crates and
  # clear_on_drop). A new entry needs the same three things they had: why it
  # fires, why it is not exploitable here, and what makes it go away.

  # NOTE: the 2026-08-09 review also listed GHSA-7gcf-g7xr-8hxj (serde_with).
  # It does NOT fire against this lockfile — cargo-deny reads the RustSec
  # database, which carries no matching advisory. Deliberately NOT ignored: an
  # entry for something that does not fire would hide it if it ever appeared.
]
